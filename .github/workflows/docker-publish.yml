name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: images
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
        run: |
          set -euo pipefail
          ghcr_image="${GHCR_REGISTRY}/${IMAGE_NAME,,}"
          echo "ghcr=${ghcr_image}" >> "$GITHUB_OUTPUT"
          images="${ghcr_image}"
          if [[ -n "${ACR_REGISTRY:-}" && -n "${ACR_REPOSITORY:-}" ]]; then
            acr_image="${ACR_REGISTRY}/${ACR_REPOSITORY}"
            echo "acr_enabled=true" >> "$GITHUB_OUTPUT"
            echo "acr=${acr_image}" >> "$GITHUB_OUTPUT"
            images="${images}"$'\n'"${acr_image}"
            echo "Will push GHCR + ACR: ${acr_image}"
          else
            echo "acr_enabled=false" >> "$GITHUB_OUTPUT"
            echo "acr=" >> "$GITHUB_OUTPUT"
            echo "ACR secrets missing; push GHCR only"
          fi
          {
            echo "list<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        if: steps.images.outputs.acr_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright/python:v1.64.1-noble
            USE_CHINA_MIRROR=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
