services:
  b2bwork-login:
    build: .
    ports:
      - "8056:8056"
      # 7900 仅容器内供 /vnc 代理使用，不对外暴露
    environment:
      API_TOKEN: ${API_TOKEN:-dev-token-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      CONSOLE_USER: ${CONSOLE_USER:-admin}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-admin}
      ENABLE_VNC: "true"
      PLAYWRIGHT_HEADLESS: "false"
      VNC_PAGE_URL: ${VNC_PAGE_URL:-/vnc/vnc.html?autoconnect=true&resize=scale&path=vnc/websockify}
      VNC_UPSTREAM: http://127.0.0.1:7900
      QUEUE_DB_PATH: /data/queue.db
      DATA_DIR: /data
      TZ: Asia/Shanghai
      # 慢网模拟（留空 / off 关闭）；需 cap_add NET_ADMIN
      NET_RATE: ${NET_RATE:-2mbit}
      NET_DELAY: ${NET_DELAY:-100ms}
      NET_LOSS: ${NET_LOSS:-}
    volumes:
      - b2bwork_data:/data
    shm_size: "1gb"
    # CPU 限制（模拟慢机器）；改 CPU_LIMIT= 提高核数
    cpus: ${CPU_LIMIT:-1.0}
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  b2bwork_data:
